name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *" # Daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  update-art:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements-ci.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap and stats
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/make_stats_svg.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet contrib-heatmap.svg github-stats.svg data/contributions.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contrib-heatmap.svg github-stats.svg data/contributions.json
          git commit -m "chore: update contribution profile art [skip ci]"

          git pull --rebase origin main
          git push origin main
