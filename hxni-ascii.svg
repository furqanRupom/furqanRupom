            .l33 { animation-delay: 0.660s; }
            .l34 { animation-delay: 0.680s; }
            .l35 { animation-delay: 0.700s; }
            .l36 { animation-delay: 0.720s; }
            .l37 { animation-delay: 0.740s; }
            .l38 { animation-delay: 0.760s; }
            .l39 { animation-delay: 0.780s; }
            .l40 { animation-delay: 0.800s; }
        </style>
