<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Developer character sign</title>
<desc>A flat illustration of a coder mascot sitting at a laptop under a hanging sign that reads "dev mode: online".</desc>

<style>
  .t { font-family: sans-serif; font-size: 14px; fill: #1a1a1a; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #1a1a1a; }
  .ts { font-family: sans-serif; font-size: 12px; fill: #4a4a4a; }
</style>

<rect width="680" height="520" fill="#f5f5f4"/>

<g transform="translate(340,60)">
  <rect x="-110" y="0" width="220" height="60" rx="8" fill="#0f766e"/>
  <text x="0" y="24" text-anchor="middle" class="th" fill="#ffffff">&lt;/&gt; dev mode</text>
  <text x="0" y="44" text-anchor="middle" class="ts" fill="#ccfbf1">status: online</text>
  <line x1="-60" y1="60" x2="-60" y2="90" stroke="#a8a29e" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="60" y2="90" stroke="#a8a29e" stroke-width="1.5"/>
</g>

<g transform="translate(280,150)">
  <rect x="0" y="0" width="15" height="140" rx="3" fill="#a8a29e"/>
  <rect x="225" y="0" width="15" height="140" rx="3" fill="#a8a29e"/>
</g>

<g transform="translate(215,260)">
  <ellipse cx="125" cy="230" rx="150" ry="18" fill="#e7e5e4"/>

  <rect x="55" y="40" width="140" height="120" rx="16" fill="#7e5bef"/>
  <circle cx="125" cy="35" r="45" fill="#f5a524"/>
  <circle cx="107" cy="30" r="5" fill="#1a1a1a"/>
  <circle cx="143" cy="30" r="5" fill="#1a1a1a"/>
  <path d="M105 48 Q125 60 145 48" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="70" y="55" width="110" height="20" rx="4" fill="#0f766e"/>
  <text x="125" y="70" text-anchor="middle" class="ts" fill="#ffffff">code on</text>

  <rect x="10" y="150" width="230" height="14" rx="4" fill="#78716c"/>
  <rect x="30" y="120" width="190" height="35" rx="3" fill="#78716c"/>
  <rect x="45" y="128" width="160" height="18" rx="2" fill="#f5f5f4"/>
  <text x="125" y="141" text-anchor="middle" class="ts" fill="#4a4a4a">01001 &gt;_ ready</text>

  <rect x="-35" y="95" width="35" height="12" rx="3" fill="#3b82f6"/>
  <rect x="235" y="95" width="35" height="12" rx="3" fill="#3b82f6"/>
</g>

</svg>
