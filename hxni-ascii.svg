    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style>
            .bg { fill: #0d0d0d; stroke: #1a2a2a; stroke-width: 1.5px; }
            .text {
                font-family: "Courier New", Consolas, monospace;
                font-size: 6.2px;
                fill: #00FFD1;
                white-space: pre;
                filter: url(#glow);
            }
            .line { opacity: 0; animation: fin 0.4s forwards; }
            @keyframes fin {
                from { opacity: 0; transform: translateY(2px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .l0 { animation-delay: 0.000s; }
            .l1 { animation-delay: 0.020s; }
            .l2 { animation-delay: 0.040s; }
            .l3 { animation-delay: 0.060s; }
            .l4 { animation-delay: 0.080s; }
