<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 550" width="370" height="550">
    <defs>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style>
            .bg { fill: #0a0f0d; stroke: #1a2a2a; stroke-width: 2px; }
            .title {
                font-family: "Courier New", Consolas, monospace;
                font-size: 14px;
                font-weight: bold;
                fill: #E0E0E0;
                text-anchor: middle;
            }
            .sign-text {
                font-family: "Courier New", Consolas, monospace;
                font-size: 13px;
                font-weight: bold;
                fill: #00FFD1;
                filter: url(#glow);
                text-anchor: middle;
            }
            .sign-sub {
                font-family: "Courier New", Consolas, monospace;
                font-size: 9px;
                fill: #7fffe0;
                text-anchor: middle;
            }
            .screen-text {
                font-family: "Courier New", Consolas, monospace;
                font-size: 9px;
                fill: #00FFD1;
                filter: url(#glow);
                text-anchor: middle;
            }
            .line-sep { stroke: #1a2a2a; stroke-width: 1px; }
        </style>
    </defs>

    <!-- Background Card -->
    <rect class="bg" width="100%" height="100%" rx="12" />

    <!-- Terminal Header (matching info-card.svg) -->
    <g transform="translate(15, 20)">
        <circle cx="0" cy="0" r="6" fill="#FF5F56" />
        <circle cx="20" cy="0" r="6" fill="#FFBD2E" />
        <circle cx="40" cy="0" r="6" fill="#27C93F" />
    </g>
    <text x="185" y="25" class="title">furqanRupom.sh</text>
    <line x1="0" y1="40" x2="370" y2="40" class="line-sep" />

    <!-- Hanging dev sign -->
    <g transform="translate(185, 75)">
        <line x1="-55" y1="0" x2="-55" y2="-14" stroke="#1a2a2a" stroke-width="1.5"/>
        <line x1="55" y1="0" x2="55" y2="-14" stroke="#1a2a2a" stroke-width="1.5"/>
        <rect x="-95" y="0" width="190" height="46" rx="6" fill="#0a0f0d" stroke="#00FFD1" stroke-width="1" filter="url(#glow)"/>
        <text x="0" y="20" class="sign-text">&lt;/&gt; DEV MODE</text>
        <text x="0" y="35" class="sign-sub">STATUS: ONLINE</text>
    </g>

    <!-- Character: mascot at a laptop -->
    <g transform="translate(185, 300)">
        <!-- ground shadow -->
        <ellipse cx="0" cy="205" rx="120" ry="14" fill="#101816"/>

        <!-- body -->
        <rect x="-65" y="10" width="130" height="110" rx="14" fill="#0a0f0d" stroke="#00FFD1" stroke-width="1" filter="url(#glow)"/>

        <!-- arms (drawn before head/body outline so hands read as attached) -->
        <line x1="-62" y1="60" x2="-95" y2="82" stroke="#00FFD1" stroke-width="1"/>
        <line x1="62" y1="60" x2="95" y2="82" stroke="#00FFD1" stroke-width="1"/>
        <circle cx="-95" cy="82" r="5" fill="none" stroke="#00FFD1" stroke-width="1"/>
        <circle cx="95" cy="82" r="5" fill="none" stroke="#00FFD1" stroke-width="1"/>

        <!-- head -->
        <circle cx="0" cy="-35" r="42" fill="#0a0f0d" stroke="#00FFD1" stroke-width="1" filter="url(#glow)"/>
        <circle cx="-16" cy="-38" r="4" fill="#00FFD1"/>
        <circle cx="16" cy="-38" r="4" fill="#00FFD1"/>
        <path d="M -18 -20 Q 0 -8 18 -20" fill="none" stroke="#00FFD1" stroke-width="2" stroke-linecap="round"/>

        <!-- chest badge -->
        <rect x="-45" y="30" width="90" height="18" rx="4" fill="#0a0f0d" stroke="#00FFD1" stroke-width="0.75"/>
        <text x="0" y="42.5" class="screen-text" style="font-size:8px">CODE ON</text>

        <!-- laptop, seated in front of the body -->
        <g transform="translate(0, 128)">
            <rect x="-70" y="0" width="140" height="8" rx="2" fill="#0a0f0d" stroke="#00FFD1" stroke-width="1"/>
            <rect x="-55" y="-34" width="110" height="34" rx="2" fill="#0a0f0d" stroke="#00FFD1" stroke-width="1"/>
            <text x="0" y="-14" class="screen-text">01001 &gt;_</text>
        </g>
    </g>

    <!-- footer strip -->
    <text x="185" y="520" class="sign-sub">-- built one commit at a time --</text>
</svg>
